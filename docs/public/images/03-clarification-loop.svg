<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040">
<rect width="800" height="1040" rx="24" fill="#f5f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#71849f" stroke-width="1.6"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="62" font-size="30" font-weight="700" fill="#172238">AI 帮你找问题，业务规则需要核实</text>
<g fill="white" stroke="#d5dfec" stroke-width="2"><rect x="100" y="108" width="600" height="114" rx="16"/><rect x="100" y="278" width="600" height="114" rx="16"/><rect x="100" y="448" width="600" height="114" rx="16"/><rect x="100" y="618" width="600" height="114" rx="16"/></g>
<rect x="100" y="788" width="600" height="114" rx="16" fill="#e5f2ec" stroke="#aad1bd" stroke-width="2"/>
<g font-size="24" font-weight="700" fill="#253c65"><text x="130" y="151">① 你：保存甲方原话</text><text x="130" y="321">② AI：区分事实、假设与未知</text><text x="130" y="491">③ 你：整理能核实与需询问的事项</text><text x="130" y="661">④ 甲方：确认规则，补充或修改需求</text><text x="130" y="831">⑤ 你：记录答案，再交给 AI 检查</text></g>
<g font-size="20" fill="#52637c"><text x="130" y="190">补充项目背景，暂不让 AI 实现功能</text><text x="130" y="360">提出少量关键问题，并解释影响</text><text x="130" y="530">不知道的内容保留“待确认”</text><text x="130" y="700">AI 的建议不能代替甲方的业务决定</text><text x="130" y="870">发现矛盾就继续沟通，不把猜测写成结论</text></g>
<g stroke="#71849f" stroke-width="3" marker-end="url(#arrow)"><path d="M400 222 V268"/><path d="M400 392 V438"/><path d="M400 562 V608"/><path d="M400 732 V778"/><path d="M700 845 H752 V335 H710" fill="none"/></g>
<text x="100" y="962" font-size="22" font-weight="700" fill="#21634a">本章终点：带着一份好问题清单，去确认需求。</text>
<text x="100" y="1000" font-size="19" fill="#52637c">下一章继续处理甲方回复，形成规则与验收条件。</text>
</g></svg>